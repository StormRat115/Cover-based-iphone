<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11181d"><title>Cover Shooter — Development</title><link rel="stylesheet" href="css/game.css"></head><body><canvas id="game"></canvas><div id="hud"><div id="status"></div><div id="hint"></div><div id="squadCommands"><span>SQUAD</span><button data-command="FOLLOW">FOLLOW</button><button data-command="HOLD">HOLD</button><button data-command="ASSAULT">ASSAULT</button></div><button id="restart">RESTART</button><button id="autoPlay">AUTO PLAY</button><button id="reload" class="hidden">RELOAD</button><button id="fire">FIRE</button><div id="message" class="hidden"><div class="panel"><h1 id="messageTitle"></h1><p id="messageText"></p><button id="messageButton">PLAY AGAIN</button></div></div></div><div id="runtimeError" class="hidden"></div><script>if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r||0,Math.abs(w)/2,Math.abs(h)/2);this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);this.closePath();return this}}addEventListener('error',e=>{const box=document.querySelector('#runtimeError');if(box){box.textContent='GAME ERROR: '+(e.message||'Unknown error');box.classList.remove('hidden')}});addEventListener('unhandledrejection',e=>{const box=document.querySelector('#runtimeError');if(box){box.textContent='GAME ERROR: '+(e.reason?.message||String(e.reason));box.classList.remove('hidden')}});</script><script type="module" src="js/game.js"></script></body></html>
