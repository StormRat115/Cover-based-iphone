<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11181d"><title>Cover Shooter — Development</title><link rel="stylesheet" href="css/game.css?v=20260904-24"><link rel="stylesheet" href="css/tactical.css?v=20260904-24"><style>#restart{display:none}#pause{pointer-events:auto;cursor:pointer;z-index:8}#pauseMenu{position:absolute;inset:0;display:grid;place-items:center;background:#071014b8;backdrop-filter:blur(4px);z-index:12}#pauseMenu.hidden{display:none}#pauseMenu .panel{min-width:min(340px,82vw);text-align:center;border:1px solid #ffffff44;background:#11181df5;box-shadow:0 18px 60px #000b;padding:28px 30px}#pauseMenu h1{letter-spacing:2px}#pauseMenu p{font-weight:800;letter-spacing:3px;color:#83bdd1}#pauseMenu button{display:block;width:100%;margin-top:10px;border:1px solid #ffffff55;border-radius:10px;padding:13px 16px;background:#273238;color:#fff;font-weight:900}#pauseMenu button:last-child{background:#9d2d2d}#buildStamp{position:absolute;right:10px;bottom:6px;z-index:30;font:700 8px system-ui;color:#ffffff66;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="status"></div><div id="hint"></div><button id="pause" aria-label="Pause">Ⅱ</button><div id="squadCommands"><span>SQUAD</span><button data-command="FOLLOW">FOLLOW</button><button data-command="HOLD">HOLD</button><button data-command="ASSAULT">ASSAULT</button><button data-command="FOCUS">FOCUS</button></div><div id="loadout"><div class="weapon active"><b>▰</b><strong>30 / 210</strong><small>RIFLE</small></div><div class="weapon"><b>▰</b><strong>15 / 45</strong><small>SIDEARM</small></div><div class="utility"><b>◉</b><strong>2</strong><small>GRENADE</small></div><div class="utility"><b>✚</b><strong>2</strong><small>MEDKIT</small></div></div><div id="healthBar"><span></span></div><div id="movePad"><i></i><b>‹</b><b>›</b><b>⌃</b><b>⌄</b></div><button id="autoPlay">AUTO PLAY</button><button id="reload" class="hidden">RELOAD</button><button id="fire">FIRE</button><div id="pauseMenu" class="hidden"><div class="panel"><h1>PAUSED</h1><p>TACTICAL PAUSE</p><button id="resumeButton">RESUME</button><button id="pauseRestart">RESTART MISSION</button></div></div><div id="message" class="hidden"><div class="panel"><h1 id="messageTitle"></h1><p id="messageText"></p><button id="messageButton">PLAY AGAIN</button></div></div></div><div id="runtimeError" class="hidden"></div><div id="buildStamp">BUILD 20260904-24</div><script>var BUILD='20260904-24';var originalRAF=window.requestAnimationFrame.bind(window),paused=false,pendingFrame=null;window.requestAnimationFrame=function(cb){pendingFrame=cb;if(!paused)return originalRAF(cb)};function setPaused(value){paused=value;var menu=document.getElementById('pauseMenu'),button=document.getElementById('pause');if(menu)menu.classList.toggle('hidden',!paused);if(button)button.textContent=paused?'▶':'Ⅱ';if(!paused&&pendingFrame)originalRAF(pendingFrame)}window.addEventListener('load',function(){var p=document.getElementById('pause'),r=document.getElementById('resumeButton'),rr=document.getElementById('pauseRestart');if(p)p.addEventListener('pointerdown',function(e){e.preventDefault();setPaused(!paused)});if(r)r.addEventListener('pointerdown',function(e){e.preventDefault();setPaused(false)});if(rr)rr.addEventListener('pointerdown',function(e){e.preventDefault();setPaused(false);var b=document.getElementById('messageButton');if(b)b.click();else location.reload()});});function showGameError(label,e){var box=document.getElementById('runtimeError');if(!box)return;var msg=e&&e.message?e.message:String(e);var stack=e&&e.stack?e.stack:'';box.textContent='GAME ERROR ['+label+'] BUILD '+BUILD+': '+msg+(stack?'\n\n'+stack:'');box.classList.remove('hidden')}window.addEventListener('error',function(e){showGameError('RUNTIME',e.error||e)});window.addEventListener('unhandledrejection',function(e){showGameError('PROMISE',e.reason||e)});window.addEventListener('load',function(){var v=BUILD;function load(name,url){return import(url).catch(function(e){throw new Error(name+' failed: '+(e&&e.message?e.message:String(e)))});}load('PLAYER','./js/player.js?v='+v).then(function(){return load('ENEMY','./js/enemy.js?v='+v)}).then(function(){return load('ALLY','./js/ally.js?v='+v)}).then(function(){return load('COVER','./js/cover.js?v='+v)}).then(function(){return load('INPUT','./js/input.js?v='+v)}).then(function(){return load('TACTICAL','./js/tactical.js?v='+v)}).then(function(){return load('GAME','./js/game.js?v='+v)}).then(function(){console.log('Cover Shooter modules loaded successfully - '+BUILD)}).catch(function(e){showGameError('MODULE LOAD',e)})});</script></body></html>
