<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11181d"><title>Cover Shooter — Development</title><link rel="stylesheet" href="css/game.css"></head><body><canvas id="game"></canvas><div id="hud"><div id="status"></div><div id="hint"></div><div id="squadCommands"><span>SQUAD</span><button data-command="FOLLOW">FOLLOW</button><button data-command="HOLD">HOLD</button><button data-command="ASSAULT">ASSAULT</button></div><button id="restart">RESTART</button><button id="autoPlay">AUTO PLAY</button><button id="reload" class="hidden">RELOAD</button><button id="fire">FIRE</button><div id="message" class="hidden"><div class="panel"><h1 id="messageTitle"></h1><p id="messageText"></p><button id="messageButton">PLAY AGAIN</button></div></div></div><div id="runtimeError" class="hidden"></div><script>addEventListener('error',e=>{const box=document.querySelector('#runtimeError');if(box){box.textContent='GAME ERROR: '+(e.message||'Unknown error');box.classList.remove('hidden')}});addEventListener('unhandledrejection',e=>{const box=document.querySelector('#runtimeError');if(box){box.textContent='GAME ERROR: '+(e.reason?.message||String(e.reason));box.classList.remove('hidden')}});</script><script type="module" src="js/game.js"></script></body></html>
