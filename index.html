<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cover Shooter</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182025;touch-action:none;font-family:system-ui}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;color:white;pointer-events:none;text-shadow:0 2px 3px #000}
#status{position:absolute;top:12px;left:12px;font-size:14px;font-weight:bold}
button{pointer-events:auto}
#fire{position:absolute;left:18px;bottom:25px;width:95px;height:95px;border-radius:50%;border:2px solid white;background:#a52d2dcc;color:white;font-weight:bold;font-size:17px}
#restart{position:absolute;right:12px;top:10px;border:1px solid #fff8;border-radius:9px;background:#0008;color:white;padding:9px 12px}
#help{position:absolute;right:12px;bottom:12px;text-align:right;font-size:11px;max-width:190px}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
<div id="status"></div>
<button id="restart">RESTART</button>
<button id="fire">FIRE</button>
<div id="help">Tap the ground to move.<br>Tap an enemy to target them.<br>FIRE shoots your target or nearest enemy.</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W,H,dpr=1,last=0,over=false,won=false,target=null,kills=0;

const player={
 x:0,y:120,tx:0,ty:120,hp:100,
 speed:170,fire:0,state:"idle",anim:0,cover:false
};

const enemies=[];
const covers=[
 {x:-150,y:-30,w:170},
 {x:90,y:-75,w:190},
 {x:150,y:100,w:150},
 {x:-40,y:145,w:180}
];

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*dpr;canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

function reset(){
 player.x=0;player.y=120;
 player.tx=0;player.ty=120;
 player.hp=100;player.fire=0;
 player.state="idle";player.anim=0;
 player.cover=false;
 target=null;kills=0;over=false;won=false;

 enemies.length=0;
 enemies.push(
  {x:-220,y:-95,hp:60,max:60,fire:1.0,t:0,dead:false},
  {x:235,y:-15,hp:60,max:60,fire:1.6,t:1,dead:false},
  {x:-190,y:185,hp:60,max:60,fire:2.1,t:2,dead:false}
 );
}
reset();

function iso(x,y){
 return [
  W/2+(x-y)*.72,
  H/2+(x+y)*.38-40
 ];
}

function distance(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

function nearest(){
 let a=enemies.filter(e=>!e.dead);
 a.sort((x,y)=>distance(player,x)-distance(player,y));
 return a[0]||null;
}

function moveTo(x,y){
 player.tx=x;
 player.ty=y;
 player.state="walk";
}

function coverAt(x,y){
 return covers.some(o=>
  Math.abs(x-o.x)<o.w/2+18 &&
  Math.abs(y-o.y)<32
 );
}

function shoot(){
 if(over||won)return;

 let e=target&&!target.dead?target:nearest();
 if(!e)return;

 if(distance(player,e)>540)return;

 player.fire=.32;
 player.state="shoot";

 e.hp-=24;

 if(e.hp<=0){
  e.dead=true;
  kills++;
  if(target===e)target=null;
  if(kills===enemies.length)won=true;
 }
}

document.getElementById("fire").addEventListener("pointerdown",e=>{
 e.preventDefault();
 shoot();
});

document.getElementById("restart").addEventListener("pointerdown",reset);

canvas.addEventListener("pointerdown",e=>{
 const r=canvas.getBoundingClientRect();
 const sx=e.clientX-r.left;
 const sy=e.clientY-r.top;

 for(const enemy of enemies){
  if(enemy.dead)continue;
  const [x,y]=iso(enemy.x,enemy.y);
  if(Math.hypot(sx-x,sy-y)<35){
   target=enemy;
   return;
  }
 }

 const a=(sx-W/2)/.72;
 const b=(sy-(H/2-40))/.38;

 moveTo((a+b)/2,(b-a)/2);
});

function update(dt){
 if(over||won)return;

 player.anim+=dt;
 player.fire=Math.max(0,player.fire-dt);

 const dx=player.tx-player.x;
 const dy=player.ty-player.y;
 const d=Math.hypot(dx,dy);

 if(d>4){
  player.x+=dx/d*player.speed*dt;
  player.y+=dy/d*player.speed*dt;
  player.state="walk";
 }else if(player.state==="shoot"&&player.fire<=0){
  player.state="idle";
 }

 player.cover=coverAt(player.x,player.y);

 for(const e of enemies){
  if(e.dead)continue;

  e.t+=dt;
  e.fire-=dt;

  e.x+=Math.cos(e.t*.55)*dt*5;
  e.y+=Math.sin(e.t*.7)*dt*4;

  if(e.fire<=0){
   e.fire=1.5+Math.random()*1.2;

   if(distance(player,e)<430&&!player.cover){
    player.hp-=8;
    if(player.hp<=0)over=true;
   }
  }
 }
}

function diamond(x,y,w,h,color){
 const p=iso(x,y);
 ctx.beginPath();
 ctx.moveTo(p[0],p[1]-h);
 ctx.lineTo(p[0]+w,p[1]);
 ctx.lineTo(p[0],p[1]+h);
 ctx.lineTo(p[0]-w,p[1]);
 ctx.closePath();
 ctx.fillStyle=color;
 ctx.fill();
}

function drawWorld(){
 ctx.fillStyle="#293238";
 ctx.fillRect(0,0,W,H);

 for(let x=-700;x<=700;x+=80)
  for(let y=-500;y<=500;y+=80)
   diamond(x,y,28,15,(x+y)%160===0?"#303a3f":"#2c353a");

 for(const o of covers){
  const [x,y]=iso(o.x,o.y);
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle="#59636a";
  ctx.fillRect(-o.w*.36,-20,o.w*.72,40);
  ctx.fillStyle="#778188";
  ctx.fillRect(-o.w*.36,-20,o.w*.72,8);
  ctx.strokeStyle="#1b2226";
  ctx.strokeRect(-o.w*.36,-20,o.w*.72,40);
  ctx.restore();
 }

 if(target&&!target.dead){
  const a=iso(player.x,player.y);
  const b=iso(target.x,target.y);
  ctx.strokeStyle="#f5d547aa";
  ctx.setLineDash([5,6]);
  ctx.beginPath();
  ctx.moveTo(a[0],a[1]-28);
  ctx.lineTo(b[0],b[1]-25);
  ctx.stroke();
  ctx.setLineDash([]);
 }
}

function character(x,y,enemy,dead,frame,shooting){
 const [sx,sy]=iso(x,y);
 ctx.save();
 ctx.translate(sx,sy-(enemy?0:Math.sin(frame*10)*2));

 if(dead){
  ctx.rotate(-.8);
  ctx.globalAlpha=.55;
 }

 ctx.fillStyle="#0008";
 ctx.beginPath();
 ctx.ellipse(0,3,25,10,0,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle=enemy?"#47352c":"#202a30";
 ctx.lineWidth=7;
 ctx.beginPath();
 ctx.moveTo(-7,-2);
 ctx.lineTo(-10,20);
 ctx.moveTo(7,-2);
 ctx.lineTo(10,20);
 ctx.stroke();

 ctx.fillStyle=enemy?"#76503b":"#4e626d";
 ctx.fillRect(-13,-38,26,36);

 if(!enemy){
  ctx.fillStyle="#83949e";
  ctx.fillRect(-9,-34,18,16);
 }

 ctx.fillStyle=enemy?"#b77e59":"#9a9d9b";
 ctx.beginPath();
 ctx.arc(0,-48,10,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle=enemy?"#3e3029":"#26343b";
 ctx.fillRect(-11,-55,22,8);

 ctx.strokeStyle=enemy?"#b77e59":"#9a9d9b";
 ctx.lineWidth=6;
 ctx.beginPath();
 ctx.moveTo(-9,-31);
 ctx.lineTo(-18,-19);
 ctx.moveTo(9,-31);
 ctx.lineTo(15,-20);
 ctx.stroke();

 ctx.strokeStyle="#111";
 ctx.lineWidth=5;
 ctx.beginPath();
 ctx.moveTo(7,-22);
 ctx.lineTo(24,-16);
 ctx.stroke();

 ctx.fillStyle="#111";
 ctx.fillRect(21,-18,8,4);

 if(shooting){
  ctx.fillStyle="#ffe36b";
  ctx.beginPath();
  ctx.moveTo(29,-16);
  ctx.lineTo(40,-12);
  ctx.lineTo(29,-9);
  ctx.closePath();
  ctx.fill();
 }

 ctx.restore();
}

function drawEnemy(e){
 const [x,y]=iso(e.x,e.y);

 if(target===e){
  ctx.strokeStyle="#f5d547";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(x,y-32,20,0,Math.PI*2);
  ctx.stroke();
 }

 ctx.fillStyle="#000";
 ctx.fillRect(x-22,y-67,44,5);

 ctx.fillStyle="#e34d4d";
 ctx.fillRect(x-22,y-67,44*Math.max(0,e.hp/e.max),5);

 character(e.x,e.y,true,e.dead,e.t,false);
}

function draw(){
 drawWorld();

 for(const e of enemies)
  if(!e.dead)drawEnemy(e);

 character(
  player.x,
  player.y,
  false,
  false,
  player.anim,
  player.state==="shoot"
 );

 const status=document.getElementById("status");
 status.textContent=
  "HP "+Math.max(0,player.hp)+
  " • BANDITS DOWN "+kills+"/3"+
  (player.cover?" • IN COVER":"")+
  (target?" • TARGET LOCKED":"");

 if(over){
  ctx.fillStyle="#000a";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="white";
  ctx.textAlign="center";
  ctx.font="800 34px system-ui";
  ctx.fillText("MISSION FAILED",W/2,H/2);
  ctx.font="16px system-ui";
  ctx.fillText("Tap Restart to try again",W/2,H/2+32);
 }

 if(won){
  ctx.fillStyle="#0009";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="white";
  ctx.textAlign="center";
  ctx.font="800 34px system-ui";
  ctx.fillText("AREA CLEAR",W/2,H/2);
  ctx.font="16px system-ui";
  ctx.fillText("Tap Restart to replay",W/2,H/2+32);
 }
}

function loop(t){
 const dt=Math.min(.033,(t-last)/1000||0);
 last=t;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
