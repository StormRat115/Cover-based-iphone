<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <meta name="theme-color" content="#11181d" />
    <title>Cover Shooter — Development</title>
    <link rel="stylesheet" href="css/game.css?v=20260905-60" />
    <link rel="stylesheet" href="css/tactical.css?v=20260905-60" />
    <link rel="stylesheet" href="css/menu.css?v=20260905-60" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="status"></div>
      <div id="hint"></div>
      <button id="pause" aria-label="Pause">Ⅱ</button>
      <div id="squadCommands">
        <span>SQUAD</span><button data-command="FOLLOW">FOLLOW</button
        ><button data-command="HOLD">HOLD</button
        ><button data-command="ASSAULT">ASSAULT</button
        ><button data-command="FOCUS">FOCUS</button>
      </div>
      <div id="loadout">
        <div class="weapon active">
          <b>▰</b><strong>30 / 210</strong><small>RIFLE</small>
        </div>
        <div class="weapon">
          <b>▰</b><strong>15 / 45</strong><small>SIDEARM</small>
        </div>
        <div class="utility">
          <b>◉</b><strong>2</strong><small>GRENADE</small>
        </div>
        <div class="utility">
          <b>✚</b><strong>2</strong><small>MEDKIT</small>
        </div>
      </div>
      <div id="healthBar"><span></span></div>
      <div id="movePad"><i></i><b>‹</b><b>›</b><b>⌃</b><b>⌄</b></div>
      <button id="autoPlay">AUTO PLAY</button
      ><button id="reload" class="hidden">RELOAD</button
      ><button id="fire">FIRE</button>
      <div id="pauseMenu" class="hidden">
        <div class="panel">
          <h1>PAUSED</h1>
          <p>TACTICAL PAUSE</p>
          <button id="resumeButton">RESUME</button
          ><button id="pauseRestart">RESTART MISSION</button>
        </div>
      </div>
      <div id="message" class="hidden">
        <div class="panel">
          <h1 id="messageTitle"></h1>
          <p id="messageText"></p>
          <button id="messageButton">PLAY AGAIN</button>
        </div>
      </div>
    </div>
    <div id="runtimeError" class="hidden"></div>
    <div id="buildStamp">BUILD 20260905-60</div>
    <div id="mainMenu" class="hidden">
      <div class="menuPanel">
        <div id="mainMenuHome" class="menuPage">
          <div class="menuTitle">COVER SHOOTER</div>
          <div class="menuKicker">TACTICAL SQUAD COMBAT</div>
          <button id="menuPlay" class="menuButton primary">PLAY</button
          ><button id="menuLoadout" class="menuButton secondary">
            LOADOUT
          </button>
        </div>
        <div id="mainMenuLoadout" class="menuPage hidden">
          <div class="menuTitle">LOADOUT</div>
          <div class="menuKicker">CHARACTER & WEAPON STATS</div>
          <div id="menuLoadoutRows"></div>
          <button id="menuBack" class="menuButton primary">BACK</button>
        </div>
      </div>
    </div>
    <div id="loadingScreen">
      <div id="loadingPanel">
        <div id="loadingTitle">COVER SHOOTER</div>
        <div id="loadingSub">PREPARING BATTLEFIELD</div>
        <div id="loadingPercent">0%</div>
        <div id="loadingTrack"><div id="loadingFill"></div></div>
        <div id="loadingStatus">INITIALIZING</div>
        <button id="startGame" type="button">CONTINUE</button>
      </div>
    </div>
    <script type="module" src="js/boot.js?v=20260905-60"></script>
  </body>
</html>
