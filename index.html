<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11181d"><title>Cover Shooter — Development</title><link rel="stylesheet" href="css/game.css?v=20260905-46"><link rel="stylesheet" href="css/tactical.css?v=20260905-46"><style>#restart{display:none}#pause{pointer-events:auto;cursor:pointer;z-index:8}#pauseMenu{position:absolute;inset:0;display:grid;place-items:center;background:#071014b8;backdrop-filter:blur(4px);z-index:12}#pauseMenu.hidden{display:none}#pauseMenu .panel{min-width:min(340px,82vw);text-align:center;border:1px solid #ffffff44;background:#11181df5;box-shadow:0 18px 60px #000b;padding:28px 30px}#pauseMenu h1{letter-spacing:2px}#pauseMenu p{font-weight:800;letter-spacing:3px;color:#83bdd1}#pauseMenu button{display:block;width:100%;margin-top:10px;border:1px solid #ffffff55;border-radius:10px;padding:13px 16px;background:#273238;color:#fff;font-weight:900}#pauseMenu button:last-child{background:#9d2d2d}#buildStamp{position:absolute;right:10px;bottom:6px;z-index:30;font:700 8px system-ui;color:#ffffff66;pointer-events:none}#loadingScreen,#mainMenu{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:#0b1115;color:#fff;padding:24px;box-sizing:border-box}#loadingScreen.hidden,#mainMenu.hidden,.menuPage.hidden{display:none}#loadingPanel,#mainMenu .menuPanel{width:min(390px,88vw);text-align:center}#loadingTitle,.menuTitle{font:950 28px/1 system-ui;letter-spacing:2px;margin-bottom:10px}.menuKicker,#loadingSub{font:800 10px/1.4 system-ui;letter-spacing:1.6px;color:#91a5af;margin-bottom:22px}#loadingPercent{font:950 42px/1 system-ui;letter-spacing:1px;margin-bottom:12px}#loadingTrack{height:8px;border:1px solid #ffffff38;border-radius:999px;overflow:hidden;background:#ffffff0d}#loadingFill{width:0;height:100%;background:#7eb8d2;transition:width .16s ease}#loadingStatus{min-height:18px;margin-top:10px;font:800 9px/1.4 system-ui;letter-spacing:1.2px;color:#a9b7bd}#startGame{display:none}.menuButton,#startGame{width:100%;min-height:50px;margin-top:12px;border:1px solid #ffffff66;border-radius:10px;background:#243943;color:#fff;font:950 15px system-ui;letter-spacing:1.4px}.menuButton.primary{background:#315a68}.menuButton.secondary{background:#202a2f}#startGame.ready{display:block}.menuLoadoutRow{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:10px;margin:10px 0;text-align:left;font:900 11px system-ui;letter-spacing:1px;color:#a9c8d4}.menuLoadoutRow select{width:100%;min-height:44px;border:1px solid #ffffff44;border-radius:9px;background:#182228;color:#fff;padding:0 10px;font:800 11px system-ui}#playerHealthTop{position:fixed;z-index:7;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);width:min(330px,52vw);pointer-events:none;text-align:center;color:#fff;font:900 10px system-ui;letter-spacing:1.2px;text-shadow:0 2px 4px #000}#playerHealthTop .track{height:8px;margin-top:4px;border:1px solid #ffffff44;border-radius:999px;background:#101714dd;overflow:hidden}#playerHealthTopFill{height:100%;width:100%;background:#63c66b;transition:width .15s linear}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="status"></div><div id="hint"></div><div id="playerHealthTop"><span id="playerHealthTopText">PLAYER · 100%</span><div class="track"><div id="playerHealthTopFill"></div></div></div><button id="pause" aria-label="Pause">Ⅱ</button><div id="squadCommands"><span>SQUAD</span><button data-command="FOLLOW">FOLLOW</button><button data-command="HOLD">HOLD</button><button data-command="ASSAULT">ASSAULT</button><button data-command="FOCUS">FOCUS</button></div><div id="loadout"><div class="weapon active"><b>▰</b><strong>30 / 210</strong><small>RIFLE</small></div><div class="weapon"><b>▰</b><strong>15 / 45</strong><small>SIDEARM</small></div><div class="utility"><b>◉</b><strong>2</strong><small>GRENADE</small></div><div class="utility"><b>✚</b><strong>2</strong><small>MEDKIT</small></div></div><div id="healthBar"><span></span></div><div id="movePad"><i></i><b>‹</b><b>›</b><b>⌃</b><b>⌄</b></div><button id="autoPlay">AUTO PLAY</button><button id="reload" class="hidden">RELOAD</button><button id="fire">FIRE</button><div id="pauseMenu" class="hidden"><div class="panel"><h1>PAUSED</h1><p>TACTICAL PAUSE</p><button id="resumeButton">RESUME</button><button id="pauseRestart">RESTART MISSION</button></div></div><div id="message" class="hidden"><div class="panel"><h1 id="messageTitle"></h1><p id="messageText"></p><button id="messageButton">PLAY AGAIN</button></div></div></div><div id="runtimeError" class="hidden"></div><div id="buildStamp">BUILD 20260905-46</div><div id="mainMenu" class="hidden"><div class="menuPanel"><div id="mainMenuHome" class="menuPage"><div class="menuTitle">COVER SHOOTER</div><div class="menuKicker">TACTICAL SQUAD COMBAT</div><button id="menuPlay" class="menuButton primary">PLAY</button><button id="menuLoadout" class="menuButton secondary">LOADOUT</button></div><div id="mainMenuLoadout" class="menuPage hidden"><div class="menuTitle">LOADOUT</div><div class="menuKicker">CHOOSE SQUAD WEAPONS</div><div id="menuLoadoutRows"></div><button id="menuBack" class="menuButton primary">BACK</button></div></div></div><div id="loadingScreen"><div id="loadingPanel"><div id="loadingTitle">COVER SHOOTER</div><div id="loadingSub">PREPARING BATTLEFIELD</div><div id="loadingPercent">0%</div><div id="loadingTrack"><div id="loadingFill"></div></div><div id="loadingStatus">INITIALIZING</div><button id="startGame" type="button">CONTINUE</button></div></div><script>var BUILD='20260905-46';var originalRAF=window.requestAnimationFrame.bind(window),bootPaused=true,pendingFrame=null;window.requestAnimationFrame=function(cb){pendingFrame=cb;if(!bootPaused)return originalRAF(cb)};function releaseGameLoop(){if(!bootPaused)return;bootPaused=false;if(pendingFrame)originalRAF(pendingFrame)}function showGameError(label,e){var box=document.getElementById('runtimeError');if(!box)return;var msg=e&&e.message?e.message:String(e),stack=e&&e.stack?e.stack:'';box.textContent='GAME ERROR ['+label+'] BUILD '+BUILD+': '+msg+(stack?'\n\n'+stack:'');box.classList.remove('hidden')}window.addEventListener('error',function(e){showGameError('RUNTIME',e.error||e)});window.addEventListener('unhandledrejection',function(e){showGameError('PROMISE',e.reason||e)});function setLoad(pct,text){pct=Math.max(0,Math.min(100,Math.round(pct)));var n=document.getElementById('loadingPercent'),f=document.getElementById('loadingFill'),s=document.getElementById('loadingStatus');if(n)n.textContent=pct+'%';if(f)f.style.width=pct+'%';if(s&&text)s.textContent=text}window.addEventListener('load',function(){var v=BUILD,start=document.getElementById('startGame'),screen=document.getElementById('loadingScreen'),menu=document.getElementById('mainMenu'),soldier=null,city=null,menuModule=null;function load(name,url){return import(url).catch(function(e){throw new Error(name+' failed: '+(e&&e.message?e.message:String(e)))})}setLoad(3,'LOADING MENU');load('MENU','./js/mainMenu.js?v='+v).then(function(m){menuModule=m;setLoad(7,'LOADING SOLDIER SYSTEM');return load('SOLDIER','./js/soldierAssets.js?v='+v)}).then(function(m){soldier=m;return soldier.preloadSoldierAssets(function(p,text){setLoad(7+p*11,text)})}).then(function(){setLoad(20,'LOADING PLAYER');return load('PLAYER','./js/player.js?v='+v)}).then(function(){setLoad(28,'LOADING ENEMIES');return load('ENEMY','./js/enemy.js?v='+v)}).then(function(){setLoad(36,'LOADING SQUAD');return load('ALLY','./js/ally.js?v='+v)}).then(function(){setLoad(44,'LOADING CITY SYSTEMS');return load('CITY ASSETS','./js/cityAssets.js?v='+v)}).then(function(m){city=m;return city.preloadCityAssets(function(p,text){setLoad(48+p*22,text)})}).then(function(){setLoad(72,'LOADING COVER');return load('COVER','./js/cover.js?v='+v)}).then(function(){setLoad(80,'LOADING INPUT');return load('INPUT','./js/input.js?v='+v)}).then(function(){setLoad(87,'LOADING WAVE SYSTEMS');return load('TACTICAL','./js/tactical.js?v='+v)}).then(function(){setLoad(95,'LOADING WAVE DEFENSE');return load('GAME','./js/gameWave.js?v='+v)}).then(function(){setLoad(100,'READY');if(start){start.classList.add('ready');start.addEventListener('pointerdown',function(e){e.preventDefault();screen.classList.add('hidden');menu.classList.remove('hidden');menuModule.initMainMenu(function(){releaseGameLoop()})},{once:true})}setInterval(function(){var p=window.__battlePlayer,fill=document.getElementById('playerHealthTopFill'),text=document.getElementById('playerHealthTopText');if(!p||!fill||!text)return;var pct=Math.max(0,Math.round(p.hp/p.maxHp*100));fill.style.width=pct+'%';fill.style.background=pct>55?'#63c66b':pct>25?'#d6b74d':'#d85b50';text.textContent='PLAYER · '+p.weapon.short+' · '+(p.dead?'KIA':p.downed?'DOWNED':pct+'%')},100)}).catch(function(e){var msg=e&&e.message?e.message:String(e);setLoad(0,'FAILED: '+msg);showGameError('MODULE LOAD',e);if(start){start.textContent='RETRY';start.classList.add('ready');start.addEventListener('pointerdown',function(ev){ev.preventDefault();location.reload()},{once:true})}})});</script></body></html>
