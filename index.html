<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#11181d">
  <title>Cover Shooter — StormRat</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="status"></div>
    <div id="hint"></div>
    <div id="waveBanner" class="hidden">WAVE 2</div>
    <div id="joystick" aria-label="Move joystick">
      <div class="joy-base">
        <div class="joy-knob"></div>
      </div>
    </div>
    <button id="restart" type="button">RESTART</button>
    <button id="reload" class="hidden" type="button">RELOAD</button>
    <button id="fire" type="button">FIRE</button>
    <div id="message" class="hidden">
      <div class="panel">
        <h1 id="messageTitle"></h1>
        <p id="messageText"></p>
        <button id="messageButton" type="button">PLAY AGAIN</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/game.js"></script>
</body>
</html>
